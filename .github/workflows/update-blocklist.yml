name: Update gambling blocklist

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current gambling list
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/gambling.txt"             -o data/gambling-upstream.txt

      - name: Validate and normalize
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, datetime

          src=Path("data/gambling-upstream.txt").read_text(errors="ignore").splitlines()
          out=set()

          for line in src:
              x=line.strip().lower()
              if not x or x.startswith("#") or x.startswith("!"):
                  continue
              x=re.sub(r"^@@\\|\\|","",x)
              x=re.sub(r"^\\|\\|","",x)
              x=x.split("^",1)[0]
              x=x.replace("www.","",1)
              x=x.split("/",1)[0].split(":",1)[0]
              if 3 <= len(x) <= 253 and "." in x and not re.search(r"[\\s<>]",x):
                  out.add(x)

          domains=sorted(out)
          Path("data/gambling-blocklist.json").write_text(
              json.dumps({
                  "version": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "count": len(domains),
                  "domains": domains
              },ensure_ascii=False,separators=(",",":"))
          )
          print("Validated domains:",len(domains))
          if len(domains) < 100000:
              raise SystemExit("Upstream list unexpectedly small; aborting update")
          PY

      - name: Commit updated database
        run: |
          git config user.name "STOP HAZARD Bot"
          git config user.email "actions@github.com"
          git add data/gambling-upstream.txt data/gambling-blocklist.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update gambling blocklist"
          git push
