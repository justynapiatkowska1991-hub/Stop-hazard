name: Android build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper (gradlew) is missing."
            echo "Generate it locally with: gradle wrapper"
            exit 1
          fi
          chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace