name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and system CMake
        run: |
          sdkmanager "ndk;23.1.7779620"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cmake --version

      - name: Clone tun2socks Android library
        run: git clone --depth 1 https://github.com/hiFrankYoung/tun2socks-android.git tun2socks-source

      - name: Configure tun2socks to use runner CMake
        working-directory: tun2socks-source
        run: |
          sed -i '/version "3.10.2"/d' tun2socks/build.gradle
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'cmake.dir=%s\n' "$(dirname "$(dirname "$(readlink -f "$(command -v cmake)")")")" >> local.properties
          cat local.properties

      - name: Build tun2socks AAR
        working-directory: tun2socks-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :tun2socks:assembleRelease

      - name: Copy real tun2socks native libraries into app
        run: |
          set -eux
          SRC=tun2socks-source/tun2socks/build/intermediates/stripped_native_libs/release/out/lib
          test -d "$SRC"
          find "$SRC" -type f -name '*.so' -print
          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main/jniLibs
          cp -R "$SRC"/. app/src/main/jniLibs/
          test -f app/src/main/jniLibs/arm64-v8a/libtun2socks.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify tun2socks is packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/.*/libtun2socks\.so'
          test $(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c 'libtun2socks\.so') -ge 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-hazard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
