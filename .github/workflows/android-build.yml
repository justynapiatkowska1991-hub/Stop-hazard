name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install legacy Android build tools required by tun2socks
        run: |
          sdkmanager "ndk;23.1.7779620" "cmake;3.10.2"

      - name: Clone tun2socks Android library
        run: git clone --depth 1 https://github.com/hiFrankYoung/tun2socks-android.git tun2socks-source

      - name: Build tun2socks AAR
        working-directory: tun2socks-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :tun2socks:assembleRelease

      - name: Copy real tun2socks native libraries into app
        run: |
          set -eux
          SRC=tun2socks-source/tun2socks/build/intermediates/stripped_native_libs/release/out/lib
          test -d "$SRC"
          find "$SRC" -type f -name '*.so' -print
          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main/jniLibs
          cp -R "$SRC"/. app/src/main/jniLibs/
          test -f app/src/main/jniLibs/arm64-v8a/libtun2socks.so

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify tun2socks is packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/.*/libtun2socks\.so'
          test $(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c 'libtun2socks\.so') -ge 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-hazard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
