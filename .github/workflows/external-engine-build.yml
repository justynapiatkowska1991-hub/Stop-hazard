name: External engine build

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/EXTERNAL_ENGINE_INTEGRATION_PLAN.md"
      - ".github/workflows/external-engine-build.yml"

jobs:
  build-netvalve-netstack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STOP HAZARD
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build pinned NetValve netstack AAR
        env:
          NETVALVE_COMMIT: f7b34b0fb93b9d1e6a80f513c1434697eed632ce
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          GOTOOLCHAIN: auto
        run: |
          git clone https://github.com/IEAmir/NetValve.git /tmp/NetValve
          cd /tmp/NetValve
          git checkout "${NETVALVE_COMMIT}"
          chmod +x netstack/build-aar.sh
          cd netstack
          ./build-aar.sh arm64
          test -s ../app/libs/netstack.aar
          cp ../app/libs/netstack.aar "${GITHUB_WORKSPACE}/netstack.aar"

      - name: Upload external engine AAR
        uses: actions/upload-artifact@v4
        with:
          name: stop-hazard-netvalve-netstack-arm64
          path: netstack.aar
          if-no-files-found: error
