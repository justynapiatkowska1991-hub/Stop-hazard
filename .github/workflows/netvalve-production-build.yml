name: NetValve isolated runtime test build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/netvalve-production-build.yml"
      - "docs/EXTERNAL_ENGINE_INTEGRATION_PLAN.md"

jobs:
  build-runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STOP HAZARD
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build pinned NetValve netstack AAR
        env:
          NETVALVE_COMMIT: f7b34b0fb93b9d1e6a80f513c1434697eed632ce
          GOTOOLCHAIN: auto
        run: |
          git clone https://github.com/IEAmir/NetValve.git /tmp/NetValve
          cd /tmp/NetValve
          git checkout "$NETVALVE_COMMIT"
          chmod +x netstack/build-aar.sh
          cd netstack
          go get -tool golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          ./build-aar.sh arm64
          test -s ../app/libs/netstack.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Run STOP HAZARD unit tests
        run: gradle --no-daemon test

      - name: Build isolated NetValve runtime test APK
        run: gradle --no-daemon clean assembleDebug -Pstophazard.netstack=true -Pstophazard.enableNetstack=true

      - name: Upload isolated runtime test APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-hazard-netvalve-runtime-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
