name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle project and run app unit tests
        run: |
          test -f "$GITHUB_WORKSPACE/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/app/build.gradle.kts"
          gradle --no-daemon --project-dir "$GITHUB_WORKSPACE" \
            :app:testDebugUnitTest --stacktrace

      - name: Build debug APK from this repository
        run: |
          gradle --no-daemon --project-dir "$GITHUB_WORKSPACE" \
            :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-hazard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
