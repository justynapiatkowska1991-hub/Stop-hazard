name: STOP HAZARD experimental NetValve device test

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "patches/netvalve-tcp-read-timeout.patch"
      - ".github/workflows/netvalve-device-test.yml"

permissions:
  contents: read

jobs:
  build-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout STOP HAZARD
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build pinned NetValve AAR for ARM64
        env:
          NETVALVE_COMMIT: f7b34b0fb93b9d1e6a80f513c1434697eed632ce
          GOTOOLCHAIN: auto
        run: |
          git clone https://github.com/IEAmir/NetValve.git /tmp/NetValve
          cd /tmp/NetValve
          git checkout "$NETVALVE_COMMIT"
          git apply "$GITHUB_WORKSPACE/patches/netvalve-tcp-read-timeout.patch"
          chmod +x netstack/build-aar.sh
          cd netstack
          go get -tool golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          ./build-aar.sh arm64
          test -s ../app/libs/netstack.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ../app/libs/netstack.aar "$GITHUB_WORKSPACE/app/libs/netstack.aar"

      - name: Run tests and build experimental APK with VPN runtime enabled
        run: |
          gradle --no-daemon --project-dir "$GITHUB_WORKSPACE" clean :app:testDebugUnitTest :app:assembleDebug \
            -Pstophazard.netstack=true -Pstophazard.enableNetstack=true --stacktrace

      - name: Upload clearly separated experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: stop-hazard-EXPERIMENTAL-netvalve-android15-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
