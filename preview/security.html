<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STOP HAZARD — bezpieczeństwo</title><link rel="stylesheet" href="style.css"></head>
<body><main class="phone">
<header class="topbar"><div><span class="eyebrow">STOP HAZARD</span><h1>Bezpieczeństwo</h1></div><span class="shield">✓</span></header>
<section class="card security-score"><div class="score-ring"><span id="score">94%</span></div><div><strong>Poziom ochrony</strong><p>Konfiguracja jest gotowa do pracy</p></div></section>
<section class="card"><div class="section-title"><h2>Kontrole</h2></div><div id="checks"></div></section>
<section class="card"><div class="section-title"><h2>Dzisiaj</h2></div><div class="stats"><div class="stat"><span id="blocked">17</span><small>Zablokowane</small></div><div class="stat"><span id="days">7</span><small>Dni ochrony</small></div><div class="stat"><span>24/7</span><small>Tryb</small></div></div></section>
<a class="back" href="index.html">← Wróć</a>
</main><script src="security.js"></script><script>
const labels={};
function draw(){const s=StopHazardSecurity.get();document.getElementById("score").textContent=s.score+"%";document.getElementById("blocked").textContent=s.blockedToday;document.getElementById("days").textContent=s.daysProtected;
document.getElementById("checks").innerHTML=s.checks.map(c=>'<label class="setting"><span><b>'+c.label+'</b><small>'+ (c.value?"Aktywne":"Wyłączone") +'</small></span><input type="checkbox" '+(c.value?"checked":"")+' data-name="'+c.label+'"></label>').join("");
document.querySelectorAll("#checks input").forEach(i=>i.onchange=()=>{StopHazardSecurity.toggle(i.dataset.name);draw()})}draw();
</script></body></html>
