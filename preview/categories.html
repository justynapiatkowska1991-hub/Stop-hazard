<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STOP HAZARD — blokady</title><link rel="stylesheet" href="style.css"></head>
<body><main class="phone">
<header class="topbar"><div><span class="eyebrow">STOP HAZARD</span><h1>Blokady</h1></div><span class="shield">⊘</span></header>
<section class="card"><div class="section-title"><h2>Kategorie</h2><span id="count">0/0</span></div><div id="categories"></div></section>
<section class="card"><div class="section-title"><h2>Tryb ochrony</h2></div><p style="color:#89939a;font-size:12px;line-height:1.6">Włącz kategorie, które mają być automatycznie blokowane. Zmiany są zapisywane lokalnie w tym podglądzie.</p></section>
<a class="back" href="index.html">← Ekran główny</a>
</main>
<script>
const key="stopHazardCategories";
const defaults=[
 ["Kasyna online","Strony kasyn i gier hazardowych",true],
 ["Bukmacherzy","Zakłady sportowe i bukmacherskie",true],
 ["Poker","Serwisy pokerowe i gry karciane",true],
 ["Loterie","Wybrane serwisy loteryjne",true],
 ["Promocje hazardowe","Reklamy i strony promujące hazard",true],
 ["Własne domeny","Domeny dodane ręcznie przez użytkownika",true]
];
let saved=JSON.parse(localStorage.getItem(key)||"null")||defaults.map(x=>x[2]);
const root=document.getElementById("categories");
function draw(){
 root.innerHTML="";
 defaults.forEach((item,i)=>{
  const row=document.createElement("label");row.className="setting";
  row.innerHTML="<span><b>"+item[0]+"</b><small>"+item[1]+"</small></span><input type='checkbox' "+(saved[i]?"checked":"")+">";
  row.querySelector("input").onchange=e=>{saved[i]=e.target.checked;localStorage.setItem(key,JSON.stringify(saved));update()};
  root.appendChild(row);
 });
 update();
}
function update(){document.getElementById("count").textContent=saved.filter(Boolean).length+"/"+saved.length}
draw();
</script></body></html>
